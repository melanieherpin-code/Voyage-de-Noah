  <h1 class="sr">Notes de Noah : quand l'IA fait semblant, le miroir des émotions</h1>
  <img src="note-noah.png" alt="Notes de Noah. Quand l'IA fait semblant : le miroir des émotions. L'IA m'a écrit « je suis triste pour toi ». Et aussi « je te comprends ». On dirait un ami… mais l'IA ne ressent rien. Nouveau mot : anthropomorphisme = prêter des émotions ou des intentions humaines à une machine. Vivant ou machine ? Un être vivant ressent, comprend, se souvient, décide, aime. Une machine traite des données : elle repère, calcule, génère. Comment l'IA « montre » une émotion, un système technique en 3 étapes : 1. Entrée : elle repère les mots de mon message (« dispute », « triste »…). 2. Traitement : elle calcule la suite de mots la plus probable. 3. Sortie : elle génère une réponse qui ressemble à de l'empathie… sans rien ressentir. Les bons mots : l'IA calcule, génère, traite. Elle ne pense pas, ne comprend pas, ne ressent pas. Pourquoi c'est important : si je crois qu'une IA est un ami, je pourrais lui confier mes secrets, ou attendre d'elle un soutien qu'elle ne peut pas donner. Pour une émotion ou un problème, je parle à un être vivant qui m'écoute vraiment. À faire : regarder la vidéo Lumni « L'IA a-t-elle des émotions ? ».">
</main>
